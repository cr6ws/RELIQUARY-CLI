[package]
name = "reliquary"
version = "0.1.0"
edition = "2021"
description = "Personal encrypted file reliquary — hide files, release them back"

[[bin]]
name = "reliquary"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
rpassword = "7.3"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
anyhow = "1"
walkdir = "2.5"
filetime = "0.2"
glob = "0.3"
hex = "0.4"
crossterm = "0.28"

[profile.release]
lto = true
strip = true
opt-level = "z"
